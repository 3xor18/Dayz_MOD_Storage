// ============================================================================
// model.cfg del LOCKER de equipo (locker.p3d) - DOS puertas animadas
// ----------------------------------------------------------------------------
// Contrato (mismo patron que la nevera, ver [[fbx-to-p3d-mueble-workflow]]):
//   - seleccion puerta IZQ en el P3D   =  "L_door"    eje memory = "L_door_axis"
//   - seleccion puerta DER en el P3D   =  "R_door"    eje memory = "R_door_axis"
//   - sources / clases de animacion    =  "L_Door" / "R_Door"
//   - en el script (Exor_Locker):  SetAnimationPhase("L_Door"/"R_Door", 0/1)
//
// ⭐ LECCION CLAVE: cada CfgSkeletons necesita un HUESO CON EL NOMBRE DE LA
// SELECCION de la puerta ("L_door", "R_door"). Binarize auto-liga la seleccion
// al hueso del mismo nombre y RECIEN AHI crea la animacion. Sin esqueleto (o con
// hueso de otro nombre) binarize DESCARTA la animacion en silencio.
// REGLA: tras binarizar, grep -c "L_Door" y "R_Door" en locker.p3d -> ambos >=1.
//
// Las 2 puertas abren OPUESTAS: una angle1 negativo, la otra positivo. Si alguna
// abre para el lado equivocado, invertir el signo de su angle1 y re-binarizar.
// ============================================================================

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	// UN hueso por cada puerta = el nombre de su seleccion.
	class locker: Default
	{
		skeletonInherit = "";
		skeletonBones[] = { "L_door", "", "R_door", "" };
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	// La clase DEBE llamarse igual que el p3d sin extension: "locker".
	class locker: Default
	{
		skeletonName = "locker";
		sectionsInherit = "";
		sections[] = { "L_door", "R_door" };

		class Animations
		{
			class L_Door
			{
				type = "rotation";
				source = "L_Door";
				selection = "L_door";
				axis = "L_door_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = 1.48;    // ~85 grados hacia afuera (signo ajustado in-game)
			};
			class R_Door
			{
				type = "rotation";
				source = "R_Door";
				selection = "R_door";
				axis = "R_door_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = -1.48;   // opuesta a la izquierda
			};
		};
	};
};
