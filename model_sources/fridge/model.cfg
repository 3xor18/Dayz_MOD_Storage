// ============================================================================
// model.cfg del REFRIGERADOR 3xor  (fridge.p3d)
// ----------------------------------------------------------------------------
// Anima la PUERTA con el contrato de "contenedor abrible" de DayZ:
//   - seleccion de la puerta en el P3D  =  "lid"
//   - eje de bisagra en el Memory LOD   =  "lid_axis"  (2 puntos verticales)
//   - source / clase de animacion       =  "Lid"
//   - en el script:  SetAnimationPhase("Lid", 0=cerrada / 1=abierta)
//
// ⭐ LECCION CLAVE (17-jul, tras diagnostico forense): la animacion SOLO se
// hornea en el ODOL si el CfgSkeletons tiene un HUESO CON EL NOMBRE DE LA
// SELECCION DE LA PUERTA ("lid"). Binarize auto-liga la seleccion "lid" al hueso
// "lid" (mismo nombre) y crea la animacion. Verificado: con este model.cfg el
// ODOL tiene el source "Lid" (grep -c "Lid" = 1, igual que el barril vanilla).
//   - skeletonName="" (sin CfgSkeletons)  -> binarize IGNORA el bloque Animations
//     en silencio -> ODOL sin "Lid" -> la puerta NO gira (aunque abrir/cerrar SI
//     cambie de estado). Fue el bug que nos trabo varias sesiones.
//   - hueso con nombre INVENTADO (ej "fridge_doors") -> binarize busca el eje por
//     el nombre del hueso y falla: "doesn't have axis ... properly defined".
//   - hueso = nombre de la SELECCION ("lid") -> FUNCIONA. El eje se toma de
//     axis="lid_axis" (memory=1) del Memory LOD.
//
// REGLA: tras binarizar, SIEMPRE  grep -c -a -o "Lid" fridge.p3d  -> si es 0, la
// animacion NO se horneo, NO deployar.
//
// binarize.exe lee este model.cfg y HORNEA la animacion en el ODOL. Es build-time:
// NO se empaqueta en el PBO (por eso vive en model_sources).
// ============================================================================

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	// Esqueleto con UN hueso = "lid" (el nombre de la seleccion de la puerta).
	// Esto es lo que habilita que binarize cree la animacion. La clase debe
	// llamarse igual que el p3d: "fridge".
	class fridge: Default
	{
		skeletonInherit = "";
		skeletonBones[] = { "lid", "" };   // hueso "lid" (sin padre)
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	// La clase DEBE llamarse igual que el archivo p3d sin extension: "fridge".
	class fridge: Default
	{
		skeletonName = "fridge";   // referencia al CfgSkeletons de arriba (hueso "lid")
		sectionsInherit = "";
		sections[] = { "lid" };

		class Animations
		{
			class Lid
			{
				type = "rotation";
				source = "Lid";
				selection = "lid";       // caras de la puerta (thin front panel)
				axis = "lid_axis";       // eje (2 pts) en el Memory LOD = bisagra
				memory = 1;
				minValue = 0;            // fase cerrada
				maxValue = 1;            // fase abierta
				angle0 = 0;              // 0 rad = puerta como se modela (CERRADA)
				// Apertura ~85 grados. Signo NEGATIVO = abre hacia AFUERA. El eje
				// lid_axis se movio a Z=0.55 (hacia el cuerpo) para que la puerta no
				// se despegue al abrir. Historial angulo: 105/70/50/65 -> 85(-1.48).
				angle1 = -1.48;
			};
		};
	};
};
