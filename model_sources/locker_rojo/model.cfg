// ============================================================================
// model.cfg del LOCKER ROJO (locker_rojo.p3d) - DOS puertas animadas (Etapa 2b)
// ----------------------------------------------------------------------------
// Mismo patron que el locker negro (ver [[fbx-to-p3d-mueble-workflow]]):
//   - seleccion puerta IZQ en el P3D   =  "L_door" (Cube.023 + su manija)
//   - seleccion puerta DER en el P3D   =  "R_door" (Cube.025 + su manija)
//   - ejes de bisagra en el Memory LOD =  "L_door_axis" / "R_door_axis" (2 pts c/u)
//   - sources / clases de animacion    =  "L_Door" / "R_Door"
//   - en el script (Exor_LockerRojo):  SetAnimationPhase("L_Door"/"R_Door", 0/1)
//
// El hueso DEBE llamarse igual que la seleccion de la puerta ("L_door","R_door")
// para que binarize auto-ligue y cree la animacion. Regla: tras binarizar,
// grep -c "L_Door" y "R_Door" en locker_rojo.p3d -> ambos >=1.
// Si una puerta abre al reves, invertir el signo de su angle1 y re-binarizar.
//
// locker_rojo_packed = SOLO visual (holograma), sin esqueleto -> estatico.
// ============================================================================
class CfgSkeletons
{
	class Default { isDiscrete = 1; skeletonInherit = ""; skeletonBones[] = {}; };
	class locker_rojo: Default
	{
		skeletonInherit = "";
		skeletonBones[] = { "L_door", "", "R_door", "" };
	};
};
class CfgModels
{
	class Default { sectionsInherit = ""; sections[] = {}; skeletonName = ""; };
	class locker_rojo: Default
	{
		skeletonName = "locker_rojo";
		sectionsInherit = "";
		sections[] = { "L_door", "R_door" };
		class Animations
		{
			class L_Door
			{
				type = "rotation";
				source = "L_Door";
				selection = "L_door";
				axis = "L_door_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = -1.48;   // abre hacia AFUERA (signo invertido: antes abria adentro)
			};
			class R_Door
			{
				type = "rotation";
				source = "R_Door";
				selection = "R_door";
				axis = "R_door_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = 1.48;    // abre hacia AFUERA (opuesta a la izquierda)
			};
		};
	};
	class locker_rojo_packed: Default { skeletonName = ""; sections[] = {}; };
};
