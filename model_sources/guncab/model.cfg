// Mueble de Armas - animacion: puerta principal (rotacion). Cajones se agregan luego.
// Contrato: bone = NOMBRE DE LA SELECCION ("MainCabinetDoor"); source "MainDoor" =
// clase en AnimationSources del config.cpp; axis "MainDoor_axis" en el Memory LOD.
class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class guncab: Default
	{
		skeletonInherit = "";
		skeletonBones[] = { "MainCabinetDoor", "" };
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class guncab: Default
	{
		skeletonName = "guncab";
		sections[] = { "MainCabinetDoor" };
		class Animations
		{
			class MainDoor
			{
				type = "rotation";
				source = "MainDoor";
				selection = "MainCabinetDoor";
				axis = "MainDoor_axis";
				memory = 1;
				minValue = 0;
				maxValue = 1;
				angle0 = 0;
				angle1 = -1.4713;	// ~84 grados; signo = direccion de apertura (flip si abre al reves)
			};
		};
	};
};
